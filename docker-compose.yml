version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app
      - build-cache:/app/build
    ports:
      - "873:873/tcp"
    environment:
      - PLATFORM=linux
      - DISTRO=ubuntu
    command: /bin/bash
    profiles:
      - dev

  # Runtime container
  simple-rsyncd:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "873:873/tcp"
    volumes:
      - ./config:/etc/simple-rsyncd:ro
      - ./data:/var/lib/simple-rsyncd
      - ./logs:/var/log/simple-rsyncd
    environment:
      - SIMPLE_RSYNCD_CONFIG=/etc/simple-rsyncd/rsyncd.conf
      - SIMPLE_RSYNCD_LOG_LEVEL=info
      - SIMPLE_RSYNCD_BIND_ADDRESS=0.0.0.0
      - SIMPLE_RSYNCD_BIND_PORT=873
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "873"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - runtime
    networks:
      - rsync-network

  # Build environments for different distributions
  build-ubuntu:
    build:
      context: .
      dockerfile: Dockerfile
      target: ubuntu-builder
    volumes:
      - ./dist:/app/dist
      - build-cache:/app/build
    environment:
      - PLATFORM=linux
      - DISTRO=ubuntu
    profiles:
      - build

  build-centos:
    build:
      context: .
      dockerfile: Dockerfile
      target: centos-builder
    volumes:
      - ./dist:/app/dist
      - build-cache:/app/build
    environment:
      - PLATFORM=linux
      - DISTRO=centos
    profiles:
      - build

  build-alpine:
    build:
      context: .
      dockerfile: Dockerfile
      target: alpine-builder
    volumes:
      - ./dist:/app/dist
      - build-cache:/app/build
    environment:
      - PLATFORM=linux
      - DISTRO=alpine
    profiles:
      - build

  # Multi-architecture build
  build-multiarch:
    build:
      context: .
      dockerfile: Dockerfile
      target: multiarch-builder
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    volumes:
      - ./dist:/app/dist
      - build-cache:/app/build
    environment:
      - PLATFORM=linux
      - DISTRO=multiarch
    profiles:
      - build

volumes:
  build-cache:
    driver: local

networks:
  rsync-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
