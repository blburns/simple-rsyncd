# Simple RSync Daemon - Basic Configuration
# Minimal setup for development and testing

[global]
# Daemon settings
daemonize = false
pid_file = /var/run/simple-rsyncd.pid
state_file = /var/run/simple-rsyncd.state
working_directory = /var/lib/simple-rsyncd
user = rsync
group = rsync
umask = 022

# Network settings
bind_address = 0.0.0.0
bind_port = 873
backlog = 128
max_connections = 50
worker_threads = 2

# SSL/TLS settings
ssl_enabled = false

# Authentication settings
auth_enabled = false

# Password policies (v0.3.0) - optional when auth is disabled
# password_policy_min_length = 8
# password_policy_require_uppercase = false
# password_policy_require_lowercase = false
# password_policy_require_digits = false

# Session management (v0.3.0) - optional when auth is disabled
# session_timeout = 3600
# enable_session_management = true

# Access control settings
access_enabled = true
access_allowed_hosts = 127.0.0.1, ::1, 192.168.1.0/24
access_denied_hosts =
access_allowed_networks = 10.0.0.0/8
access_denied_networks =

# Rate limiting settings
rate_limit_enabled = true
rate_limit_max_connections_per_minute = 30
rate_limit_max_connections_per_hour = 500
rate_limit_max_bandwidth_per_connection = 0
rate_limit_max_bandwidth_total = 0
rate_limit_connection_timeout = 300
rate_limit_idle_timeout = 60

# Logging settings (v0.3.0 enhanced)
log_level = info
log_file = /var/log/simple-rsyncd/rsyncd.log
log_format = text
log_console_output = true
log_file_output = true
log_syslog_output = false
log_max_file_size = 10MB
log_max_files = 3
log_compress_old_logs = true

# Configuration hot-reload (v0.3.0)
auto_reload = false
reload_interval = 30

# Security settings
security_chroot_enabled = false
security_drop_privileges = true
security_restrict_to_module_path = true
security_allow_symlinks = false
security_allow_hardlinks = false
security_allow_devices = false
security_allow_sockets = false

# Performance settings
performance_buffer_size = 32KB
performance_max_memory_usage = 256MB
performance_enable_compression = true
performance_compression_level = 6
performance_enable_checksum_verification = true
performance_checksum_algorithm = md5
performance_max_concurrent_transfers = 5
performance_enable_pipelining = true
performance_pipeline_depth = 3

# Monitoring settings
monitoring_enabled = true
monitoring_metrics_file = /var/lib/simple-rsyncd/metrics.json
monitoring_health_check_file = /var/lib/simple-rsyncd/health.json
monitoring_metrics_interval = 60
monitoring_health_check_interval = 300
monitoring_enable_prometheus_metrics = false

# Module definitions
[module:public]
path = /var/lib/simple-rsyncd/public
comment = Public file sharing
read_only = true
list = true
delete = false
overwrite = false
exclude_patterns = *.private, *.conf, *.log
include_patterns = *.txt, *.pdf, *.jpg, *.png, *.zip
environment_variables = PUBLIC_MODE=read_only

[module:backup]
path = /var/lib/simple-rsyncd/backup
comment = Backup storage
read_only = false
list = true
delete = true
overwrite = true
exclude_patterns = *.tmp, *.log, .DS_Store
include_patterns =
environment_variables = BACKUP_MODE=incremental
