# Simple RSync Daemon - Development Configuration
# Optimized for development environments

[global]
# Daemon settings
daemonize = false
pid_file = /tmp/simple-rsyncd.pid
state_file = /tmp/simple-rsyncd.state
working_directory = /tmp/simple-rsyncd
user = rsync
group = rsync
umask = 022

# Network settings
bind_address = 127.0.0.1
bind_port = 873
backlog = 64
max_connections = 20
worker_threads = 1

# SSL/TLS settings
ssl_enabled = false

# Authentication settings
auth_enabled = false

# Access control settings
access_enabled = false

# Rate limiting settings
rate_limit_enabled = false

# Logging settings
log_level = debug
log_file = /tmp/simple-rsyncd.log
log_format = {timestamp} [{level}] [{component}] {message}
log_console_output = true
log_file_output = true
log_syslog_output = false
log_max_file_size = 5MB
log_max_files = 2
log_compress_old_logs = false

# Security settings
security_chroot_enabled = false
security_drop_privileges = false
security_restrict_to_module_path = false
security_allow_symlinks = true
security_allow_hardlinks = true
security_allow_devices = false
security_allow_sockets = false

# Performance settings
performance_buffer_size = 16KB
performance_max_memory_usage = 128MB
performance_enable_compression = false
performance_compression_level = 1
performance_enable_checksum_verification = false
performance_checksum_algorithm = md5
performance_max_concurrent_transfers = 2
performance_enable_pipelining = false
performance_pipeline_depth = 1

# Monitoring settings
monitoring_enabled = true
monitoring_metrics_file = /tmp/simple-rsyncd-metrics.json
monitoring_health_check_file = /tmp/simple-rsyncd-health.json
monitoring_metrics_interval = 30
monitoring_health_check_interval = 60
monitoring_enable_prometheus_metrics = false

# Module definitions
[module:dev]
path = /tmp/simple-rsyncd/dev
comment = Development workspace
read_only = false
list = true
delete = true
overwrite = true
exclude_patterns =
include_patterns =
environment_variables = DEV_MODE=development

[module:test]
path = /tmp/simple-rsyncd/test
comment = Test files
read_only = false
list = true
delete = true
overwrite = true
exclude_patterns =
include_patterns =
environment_variables = TEST_MODE=testing
