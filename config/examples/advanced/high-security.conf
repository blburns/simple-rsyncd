# Simple RSync Daemon - High Security Configuration
# Enhanced security for sensitive environments

[global]
# Daemon settings
daemonize = true
pid_file = /var/run/simple-rsyncd.pid
state_file = /var/run/simple-rsyncd.state
working_directory = /var/lib/simple-rsyncd
user = rsync
group = rsync
umask = 007

# Network settings
bind_address = 127.0.0.1
bind_port = 873
backlog = 64
max_connections = 50
worker_threads = 4

# SSL/TLS settings
ssl_enabled = true
ssl_certificate_file = /etc/simple-rsyncd/ssl/server.crt
ssl_private_key_file = /etc/simple-rsyncd/ssl/server.key
ssl_ca_file = /etc/simple-rsyncd/ssl/ca.crt
ssl_cipher_suite = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305
ssl_require_client_cert = true
ssl_tls_version = 1.3
ssl_verify_peer = true

# Authentication settings
auth_enabled = true
auth_method = password
auth_realm = secure-rsyncd
auth_password_file = /etc/simple-rsyncd/users
auth_public_key_file = /etc/simple-rsyncd/keys
auth_oauth2_config_file = /etc/simple-rsyncd/oauth2.json
auth_anonymous_access = false

# Password policies (v0.3.0) - strict security requirements
password_policy_min_length = 12
password_policy_require_uppercase = true
password_policy_require_lowercase = true
password_policy_require_digits = true
password_policy_require_special = true
password_policy_expiration_hours = 2160
password_policy_max_failed_attempts = 3
password_policy_lockout_duration = 60
password_policy_prevent_reuse = true
password_policy_password_history_size = 5

# Session management (v0.3.0) - short timeout for security
session_timeout = 1800
enable_session_management = true

# Access control settings
access_enabled = true
access_allowed_hosts = 127.0.0.1, ::1
access_denied_hosts =
access_allowed_networks = 10.0.0.0/8
access_denied_networks = 0.0.0.0/0
access_reverse_dns_lookup = true
access_log_file = /var/log/simple-rsyncd/access.log
access_log_format = combined

# Rate limiting settings
rate_limit_enabled = true
rate_limit_max_connections_per_minute = 10
rate_limit_max_connections_per_hour = 100
rate_limit_max_bandwidth_per_connection = 10000000
rate_limit_max_bandwidth_total = 100000000
rate_limit_connection_timeout = 60
rate_limit_idle_timeout = 30

# Logging settings (v0.3.0 enhanced) - JSON format for structured logging
log_level = info
log_file = /var/log/simple-rsyncd/rsyncd.log
log_format = json
log_console_output = false
log_file_output = true
log_syslog_output = true
log_syslog_facility = daemon
log_max_file_size = 50MB
log_max_files = 10
log_compress_old_logs = true

# Configuration hot-reload (v0.3.0) - disabled for security
auto_reload = false
reload_interval = 30

# Security settings
security_chroot_enabled = true
security_chroot_directory = /var/lib/simple-rsyncd
security_drop_privileges = true
security_restrict_to_module_path = true
security_allow_symlinks = false
security_allow_hardlinks = false
security_allow_devices = false
security_allow_sockets = false

# Performance settings
performance_buffer_size = 32KB
performance_max_memory_usage = 256MB
performance_enable_compression = true
performance_compression_level = 6
performance_enable_checksum_verification = true
performance_checksum_algorithm = sha256
performance_max_concurrent_transfers = 5
performance_enable_pipelining = false
performance_pipeline_depth = 1

# Monitoring settings
monitoring_enabled = true
monitoring_metrics_file = /var/lib/simple-rsyncd/metrics.json
monitoring_health_check_file = /var/lib/simple-rsyncd/health.json
monitoring_metrics_interval = 60
monitoring_health_check_interval = 300
monitoring_enable_prometheus_metrics = true
monitoring_prometheus_endpoint = /metrics
monitoring_prometheus_port = 9090
monitoring_prometheus_address = 127.0.0.1

# Module definitions
[module:secure-documents]
path = /var/lib/simple-rsyncd/secure-documents
comment = Secure document storage
read_only = false
list = true
delete = false
overwrite = false
exclude_patterns = *.tmp, *.bak, ~*, *.log
include_patterns = *.pdf, *.doc, *.docx, *.txt, *.rtf
environment_variables = SECURE_MODE=documents
pre_transfer_script = /usr/local/bin/pre-secure-docs.sh
post_transfer_script = /usr/local/bin/post-secure-docs.sh
pre_delete_script = /usr/local/bin/pre-delete-secure.sh
post_delete_script =
pre_list_script = /usr/local/bin/pre-list-secure.sh
post_list_script = /usr/local/bin/post-list-secure.sh

[module:confidential]
path = /var/lib/simple-rsyncd/confidential
comment = Confidential data
read_only = true
list = false
delete = false
overwrite = false
exclude_patterns =
include_patterns = *.enc, *.gpg, *.pgp
environment_variables = CONFIDENTIAL_MODE=encrypted
pre_transfer_script = /usr/local/bin/pre-confidential.sh
post_transfer_script = /usr/local/bin/post-confidential.sh
pre_delete_script =
post_delete_script =
pre_list_script =
post_list_script =

[module:audit-logs]
path = /var/lib/simple-rsyncd/audit-logs
comment = Audit log storage
read_only = false
list = true
delete = false
overwrite = false
exclude_patterns = *.tmp
include_patterns = *.log, *.audit
environment_variables = AUDIT_MODE=append_only
pre_transfer_script = /usr/local/bin/pre-audit.sh
post_transfer_script = /usr/local/bin/post-audit.sh
pre_delete_script = /usr/local/bin/pre-delete-audit.sh
post_delete_script =
pre_list_script = /usr/local/bin/pre-list-audit.sh
post_list_script = /usr/local/bin/post-list-audit.sh
